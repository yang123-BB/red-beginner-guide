site_name: "红客初学者指南"
site_description: "从零开始，系统学习网络安全与渗透测试"
site_author: "QClaw"

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - 首页: index.md
  - 第01章 红客之道：法律、伦理与职业操守: "01_红客之道：法律、伦理与职业操守/index.md"
  - 第02章 搭建安全实验环境: "02_搭建安全实验环境/index.md"
  - 第03章 Linux基础与命令行精通: "03_Linux基础与命令行精通/index.md"
  - 第04章 计算机网络基础深度解析: "04_计算机网络基础深度解析/index.md"
  - 第05章 Python编程for Hackers: "05_Python编程for_Hackers/index.md"
  - 第06章 信息收集与OSINT: "06_信息收集与OSINT/index.md"
  - 第07章 漏洞扫描与评估: "07_漏洞扫描与评估/index.md"
  - 第08章 Web安全与OWASP Top 10: "08_Web安全与OWASP_Top_10/index.md"
  - 第09章 Burp Suite实战: "09_Burp_Suite实战/index.md"
  - 第10章 Metasploit Framework精通: "10_Metasploit_Framework精通/index.md"
  - 第11章 权限提升（Privilege Escalation）: "11_权限提升（Privilege_Escalation）/index.md"
  - 第12章 密码学基础与密码攻击: "12_密码学基础与密码攻击/index.md"
  - 第13章 后渗透与横向移动: "13_后渗透与横向移动/index.md"
  - 第14章 Active Directory攻防: "14_Active_Directory攻防/index.md"
  - 第15章 无线网络安全: "15_无线网络安全/index.md"
  - 第16章 社会工程学实战: "16_社会工程学实战/index.md"
  - 第17章 红队演练全流程: "17_红队演练全流程/index.md"
  - 第18章 认证体系与职业发展: "18_认证体系与职业发展/index.md"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
